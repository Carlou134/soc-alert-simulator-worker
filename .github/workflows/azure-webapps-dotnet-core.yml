# Builds, tests, and deploys SplunkSocWorker to Azure App Service on push to master.
#
# Required one-time setup:
# 1. Create the Azure Web App (soc-lima-metropolitana-tesis) with the .NET 8 runtime.
# 2. Download its Publish Profile from the Azure Portal (Overview page) and store it
#    as a repo secret named AZURE_WEBAPP_PUBLISH_PROFILE.
# 3. In the Web App's Configuration > General settings, enable "Always On" — required
#    for BatchSenderWorker (a timer-driven BackgroundService, not HTTP-triggered) to
#    keep running instead of being suspended after ~20 min of no incoming requests.
# 4. In the Web App's Configuration > Application settings, add (never commit these):
#      Hec__Token          = <your real HEC token>
#      Batch__Enabled      = true   (appsettings.json defaults this to false on purpose)
#    and override anything else that differs from appsettings.json, e.g. Hec__BaseUrl.

name: Build, test and deploy to Azure Web App

env:
  AZURE_WEBAPP_NAME: soc-lima-metropolitana-tesis
  AZURE_WEBAPP_PACKAGE_PATH: '.'
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: SplunkSocWorker/SplunkSocWorker.csproj

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up dependency caching for faster builds
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build (app + tests)
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: dotnet publish (app project only, not the test project)
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -o ${{ env.DOTNET_ROOT }}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ env.DOTNET_ROOT }}/myapp

  deploy:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Development'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
